[project]
name = "chassiscan"
version = "1.0.0"
description = "API de validacao e consulta de chassi (VIN)"
requires-python = ">=3.12"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "-q --cov=app --cov-report=term-missing"
testpaths = ["tests"]
