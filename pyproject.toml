[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chassiscan"
description = "API de validacao e consulta de chassi (VIN) via OCR"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dynamic = ["version"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "easyocr>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "black>=24.4",
]

[project.scripts]
chassiscan = "app.cli:main"

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

# ---------- Formatacao ----------
[tool.black]
line-length = 100
target-version = ["py312"]

# ---------- Lint ----------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG"]
ignore = ["B008"]  # Depends()/File() como default no FastAPI

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["ARG001"]  # lifespan(app: FastAPI) exigido pela assinatura do FastAPI
"tests/*" = ["B011", "ARG001", "ARG005", "S101"]
"conftest.py" = ["E402"]

# ---------- Testes ----------
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = """
-q --strict-markers --strict-config
--cov=app --cov-report=term-missing --cov-report=xml
--cov-fail-under=40
"""
filterwarnings = [
    "error::RuntimeWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "unit: testes unitarios rapidos",
    "integration: testes de integracao da API",
    "accuracy: gate de acuracia do OCR (requer fixtures de imagem)",
    "slow: testes lentos (carregam modelo EasyOCR)",
]

# ---------- Cobertura ----------
[tool.coverage.run]
source = ["app"]
branch = true
omit = ["tests/*", "app/__init__.py", "app/cli.py"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def get_reader",
]
