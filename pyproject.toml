[project]
name = "chassiscan"
version = "1.0.0"
description = "Leitura automatizada de VIN em imagens adversas"
requires-python = ">=3.11"

[project.scripts]
chassiscan = "chassiscan.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=chassiscan --cov-report=term-missing --cov-fail-under=80"
markers = ["accuracy: testes de acurácia com lote rotulado"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
