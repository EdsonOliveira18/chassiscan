name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Ruff + Black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar ferramentas de lint
        run: pip install ruff==0.8.6 black==24.10.0

      - name: Ruff
        run: ruff check app tests

      - name: Black
        run: black --check app tests

  test:
    name: Testes + Cobertura
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest
        env:
          CHASSISCAN_SKIP_WARMUP: "1"
        run: pytest -q --cov=app --cov-report=xml --cov-report=term-missing

      - name: Publicar coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: chassiscan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test do container
        shell: bash
        run: |
          set -euo pipefail
          docker rm -f chassiscan >/dev/null 2>&1 || true
          docker run -d --name chassiscan -p 8000:8000 \
            -e CHASSISCAN_SKIP_WARMUP=1 chassiscan:ci

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then ok=1; break; fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            echo "Healthcheck falhou"
            docker logs chassiscan
            docker rm -f chassiscan || true
            exit 1
          fi
          echo "OK"
          docker rm -f chassiscan || true

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (sem backend remoto)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
