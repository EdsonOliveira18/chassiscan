name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  quality:
    name: Lint, Testes e Cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Dependências de sistema (OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libglib2.0-0

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Formatação (black)
        run: black --check chassiscan tests

      - name: Análise estática (ruff)
        run: ruff check chassiscan tests

      - name: Testes unitários
        run: pytest tests/test_unit_vin.py --no-cov -v

      - name: Testes de integração
        run: pytest tests/test_integration_api.py --no-cov -v

      - name: Gate de acurácia
        run: pytest tests/test_accuracy.py --no-cov -v

      - name: Cobertura mínima (80%)
        run: pytest --cov=chassiscan --cov-report=xml --cov-report=term-missing

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker:
    name: Build e Smoke Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t chassiscan:${{ github.sha }} .

      - name: Smoke test do /health
        run: |
          docker run -d -p 8000:8000 --name chassiscan-api chassiscan:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8000/health; then
              echo "API respondendo"
              exit 0
            fi
            sleep 3
          done
          echo "API nao respondeu"
          docker logs chassiscan-api
          exit 1

  terraform:
    name: Validação da Infraestrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Formatação
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Inicializar (sem backend)
        run: terraform init -backend=false
        working-directory: infra

      - name: Validar
        run: terraform validate
        working-directory: infra
