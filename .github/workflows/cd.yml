name: CD - Deploy Contínuo

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------- Estágio 1: Qualidade ----------
  quality:
    name: Qualidade (lint + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Dependências de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0t64

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check app tests
          black --check app tests

      - name: Testes + cobertura
        env:
          CHASSISCAN_SKIP_WARMUP: "1"
        run: pytest -q --cov=app --cov-report=xml --cov-fail-under=60

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  # ---------- Estágio 2: Build & Push ----------
  build:
    name: Build & Push (GHCR)
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.dtag.outputs.tag }}
      image: ${{ steps.img.outputs.image }}
      owner: ${{ steps.img.outputs.owner }}
      image_ref: ${{ steps.img.outputs.image }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar nomes (lowercase obrigatório no GHCR)
        id: img
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "owner=${OWNER_LC}" >> "$GITHUB_OUTPUT"
          echo "🔎 image=ghcr.io/${REPO_LC} | owner=${OWNER_LC}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Resolver tag de deploy (nunca vazia)
        id: dtag
        env:
          META_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          V="${META_VERSION,,}"
          if [[ -z "$V" || "$V" == "null" || "$V" == "none" ]]; then
            V="latest"
          fi
          echo "tag=${V}" >> "$GITHUB_OUTPUT"
          echo "🏷 tag de deploy: ${V}"

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Estágio 3: Segurança ----------
  security:
    name: Segurança (Trivy)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy - scan da imagem (SARIF)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Enviar SARIF para Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: Trivy - gate (falha em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image_ref }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------- Estágio 4: Deploy Staging ----------
  deploy-staging:
    name: Deploy Staging
    needs: [build, security]
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://localhost:8000
    env:
      COMPOSE_FILE_PROD: docker-compose.prod.yml
      GH_OWNER: ${{ needs.build.outputs.owner }}
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      IMAGE_TAG: ${{ needs.build.outputs.version }}
      ROLLBACK_TAG: latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar ambiente (.env.prod)
        env:
          PG_USER: ${{ secrets.POSTGRES_USER }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          PG_DB: ${{ secrets.POSTGRES_DB }}
          APP_SECRET: ${{ secrets.SECRET_KEY }}
          DEPLOY_ENV: staging
        run: |
          IMG="${IMAGE_NAME,,}"
          OWNER_LC="${GH_OWNER,,}"
          TAG_LC="${IMAGE_TAG,,}"
          if [[ -z "$TAG_LC" || "$TAG_LC" == "none" || "$TAG_LC" == "null" ]]; then
            TAG_LC="latest"
          fi

          {
            echo "GH_OWNER=${OWNER_LC}"
            echo "IMAGE_NAME=${IMG}"
            echo "IMAGE_TAG=${TAG_LC}"
            echo "TAG=${TAG_LC}"
            echo "ENVIRONMENT=${DEPLOY_ENV}"
            echo "POSTGRES_USER=${PG_USER:-chassiscan}"
            echo "POSTGRES_PASSWORD=${PG_PASS:-chassiscan123}"
            echo "POSTGRES_DB=${PG_DB:-chassiscan}"
            echo "SECRET_KEY=${APP_SECRET:-ci-dummy-secret-change-me}"
            echo "CHASSISCAN_SKIP_WARMUP=1"
          } > .env.prod

          echo "DEPLOY_TAG=${TAG_LC}" >> "$GITHUB_ENV"
          echo "✅ .env.prod gerado | ${IMG}:${TAG_LC} (${DEPLOY_ENV})"

      - name: Validar compose
        run: docker compose --env-file .env.prod -f "$COMPOSE_FILE_PROD" config -q

      - name: Deploy staging
        run: bash scripts/deploy.sh staging "${DEPLOY_TAG}"

      - name: Smoke tests
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose --env-file .env.prod -f "$COMPOSE_FILE_PROD" ps || true
          docker compose --env-file .env.prod -f "$COMPOSE_FILE_PROD" logs --tail=100 || true

      - name: Rollback automático (staging)
        if: failure()
        run: bash scripts/rollback.sh staging "${ROLLBACK_TAG:-latest}"

  # ---------- Estágio 5: Deploy Produção ----------
  deploy-prod:
    name: Deploy Produção
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment:
      name: production # exige aprovação manual (Required reviewers)
      url: http://localhost:8000
    env:
      COMPOSE_FILE_PROD: docker-compose.prod.yml
      GH_OWNER: ${{ needs.build.outputs.owner }}
      IMAGE_NAME: ${{ needs.build.outputs.image }}
      IMAGE_TAG: ${{ needs.build.outputs.version }}
      ROLLBACK_TAG: latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar ambiente (.env.prod)
        env:
          PG_USER: ${{ secrets.POSTGRES_USER }}
          PG_PASS: ${{ secrets.POSTGRES_PASSWORD }}
          PG_DB: ${{ secrets.POSTGRES_DB }}
          APP_SECRET: ${{ secrets.SECRET_KEY }}
          DEPLOY_ENV: production
        run: |
          IMG="${IMAGE_NAME,,}"
          OWNER_LC="${GH_OWNER,,}"
          TAG_LC="${IMAGE_TAG,,}"
          if [[ -z "$TAG_LC" || "$TAG_LC" == "none" || "$TAG_LC" == "null" ]]; then
            TAG_LC="latest"
          fi

          {
            echo "GH_OWNER=${OWNER_LC}"
            echo "IMAGE_NAME=${IMG}"
            echo "IMAGE_TAG=${TAG_LC}"
            echo "TAG=${TAG_LC}"
            echo "ENVIRONMENT=${DEPLOY_ENV}"
            echo "POSTGRES_USER=${PG_USER:-chassiscan}"
            echo "POSTGRES_PASSWORD=${PG_PASS:-chassiscan123}"
            echo "POSTGRES_DB=${PG_DB:-chassiscan}"
            echo "SECRET_KEY=${APP_SECRET:-ci-dummy-secret-change-me}"
            echo "CHASSISCAN_SKIP_WARMUP=1"
          } > .env.prod

          echo "DEPLOY_TAG=${TAG_LC}" >> "$GITHUB_ENV"
          echo "✅ .env.prod gerado | ${IMG}:${TAG_LC} (${DEPLOY_ENV})"

      - name: Validar compose
        run: docker compose --env-file .env.prod -f "$COMPOSE_FILE_PROD" config -q

      - name: Deploy produção
        run: bash scripts/deploy.sh production "${DEPLOY_TAG}"

      - name: Smoke tests
        id: smoke
        run: bash scripts/smoke_test.sh http://localhost:8000

      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose --env-file .env.prod -f "$COMPOSE_FILE_PROD" ps || true
          docker compose --env-file .env.prod -f "$COMPOSE_FILE_PROD" logs --tail=100 || true

      - name: Rollback automático
        if: failure()
        run: bash scripts/rollback.sh production "${ROLLBACK_TAG:-latest}"

      - name: Resumo do deploy
        if: always()
        run: |
          {
            echo "### Deploy produção"
            echo "- Imagem: ${IMAGE_NAME,,}"
            echo "- Versão: ${DEPLOY_TAG:-${IMAGE_TAG}}"
            echo "- Digest: ${{ needs.build.outputs.digest }}"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
